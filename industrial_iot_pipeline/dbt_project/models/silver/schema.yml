version: 2

models:
  - name: silver_sensor_readings
    description: "Cleaned and validated sensor readings from industrial equipment fleet"
    columns:
      - name: event_id
        description: "Unique identifier for each sensor event"
        tests:
          - not_null
          - unique
      - name: equipment_id
        description: "Equipment identifier"
        tests:
          - not_null
          - accepted_values:
              values: ["EQ-001", "EQ-002", "EQ-003", "EQ-004", "EQ-005"]
      - name: equipment_type
        description: "Type of equipment"
        tests:
          - not_null
          - accepted_values:
              values: ["excavator", "bulldozer", "wheel_loader", "dump_truck", "motor_grader"]
      - name: nox_ppm
        description: "NOx emissions in parts per million"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: temp_coolant_c
        description: "Coolant temperature in Celsius"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 50 and 130"
      - name: emissions_severity
        description: "Emissions severity classification"
        tests:
          - accepted_values:
              values: ["NORMAL", "MEDIUM", "HIGH", "CRITICAL"]
      - name: engine_status
        description: "Engine operational status"
        tests:
          - accepted_values:
              values: ["NORMAL", "OVERHEATING", "LOW_OIL_PRESSURE", "HIGH_RPM"]
